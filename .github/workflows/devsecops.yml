jobs:

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:

      # Checkout your actual project
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Checkout leaky-repo for testing
      - name: Checkout Leaky Repository
        uses: actions/checkout@v6
        with:
          repository: secure-java-devsecops/leaky-repo
          path: leaky-repo
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks

          sudo mv gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Run Gitleaks
        id: gitleaks
        run: |
          set +e

          gitleaks dir ./leaky-repo \
            --config ./gitleaks.toml \
            --redact \
            --verbose

          EXIT_CODE=$?

          echo "Gitleaks exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ No secrets detected"
          elif [ "$EXIT_CODE" -eq 1 ]; then
            echo "❌ Secrets detected!"
          else
            echo "❌ Gitleaks encountered an error"
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit "$EXIT_CODE"