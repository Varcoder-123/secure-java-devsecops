title = "Custom DevSecOps Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "custom-hardcoded-secret"
description = "Potential hardcoded secret detected"

regex = '''(?i)\b(?=[A-Za-z0-9!@#$%^&*._-]{8,}$)(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*._-])[A-Za-z0-9!@#$%^&*._-]{8,}\b'''