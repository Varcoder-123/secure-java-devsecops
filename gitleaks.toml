title = "DevSecOps Gitleaks Configuration"

[extend]
useDefault = true


# ============================================================
# 1. Generic hardcoded secrets
# ============================================================

[[rules]]
id = "generic-hardcoded-secret"
description = "Generic hardcoded credential"

regex = '''(?i)(key|api|token|secret|password|passwd|pwd|pass|credential|auth)[a-zA-Z0-9_. -]{0,30}(=|:|=>|:=)\s*["']([^"']{6,150})["']'''

secretGroup = 2

keywords = [
    "key",
    "api",
    "token",
    "secret",
    "password",
    "passwd",
    "pwd",
    "pass",
    "credential",
    "auth"
]


# ============================================================
# 2. XML passwords
# ============================================================

[[rules]]
id = "xml-password"
description = "Hardcoded password in XML"

regex = '''(?i)<password>\s*([^<\r\n]{6,150})\s*</password>'''

secretGroup = 1

keywords = [
    "password"
]


# ============================================================
# 3. Docker authentication
# ============================================================

[[rules]]
id = "docker-auth-token"
description = "Docker registry authentication token"

path = '''(^|/)(\.docker/)?(config\.json|\.dockercfg)$'''

regex = '''(?i)"auth"\s*:\s*"([^"]{8,})"'''

secretGroup = 1

keywords = [
    "auth"
]


# ============================================================
# 4. .env / environment variables
# ============================================================

[[rules]]
id = "environment-secret"
description = "Hardcoded secret in environment file"

path = '''(^|/)\.env(\..*)?$'''

regex = '''(?i)^[ \t]*(API_KEY|API_TOKEN|AUTH_TOKEN|ACCESS_TOKEN|SECRET_KEY|PRIVATE_KEY|PASSWORD|DB_PASSWORD|DATABASE_PASSWORD|CLIENT_SECRET)[ \t]*=[ \t]*["']?([^"' \r\n]{6,150})["']?[ \t]*$'''

secretGroup = 2

keywords = [
    "API_KEY",
    "API_TOKEN",
    "AUTH_TOKEN",
    "ACCESS_TOKEN",
    "SECRET_KEY",
    "PRIVATE_KEY",
    "PASSWORD",
    "DB_PASSWORD",
    "DATABASE_PASSWORD",
    "CLIENT_SECRET"
]


# ============================================================
# 5. Authorization / Bearer tokens
# ============================================================

[[rules]]
id = "bearer-token"
description = "Hardcoded bearer authentication token"

regex = '''(?i)Bearer\s+([A-Za-z0-9\-._~+/]+=*)'''

secretGroup = 1

keywords = [
    "Bearer"
]


# ============================================================
# 6. Basic authentication
# ============================================================

[[rules]]
id = "basic-authentication"
description = "Hardcoded Basic authentication credential"

regex = '''(?i)(Authorization|authorization)\s*[:=]\s*["']?Basic\s+([A-Za-z0-9+/]{12,}={0,2})["']?'''

secretGroup = 2

keywords = [
    "Authorization",
    "Basic"
]