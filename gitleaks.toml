title = "Custom DevSecOps Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "hardcoded-password"
description = "Hardcoded password detected"
regex = '''(?i)(password|passwd|pwd|pass)\s*[:=]\s*["']?[A-Za-z0-9!@#$%^&*._-]{6,}["']?'''
keywords = [
    "password",
    "passwd",
    "pwd",
    "pass"
]

[[rules]]
id = "docker-auth-token"
description = "Docker registry authentication token detected"

regex = '''(?i)"auth"\s*:\s*"([A-Za-z0-9+/]{20,}={0,2})"'''

secretGroup = 1

keywords = [
    "auth"
]

entropy = 3.0
